<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
    <style>


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
        
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: greenyellow;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            width: 100%;
        }

        .nav-brand {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover,

        
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

    
        .portal-card {
            
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);

        }



        .header {
            margin-bottom: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.9rem;
            
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        input {
        
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 0.95rem;
            width: 100%;

        }

        input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
        
        }



        .btn-submit {
            
            color: white;
        }

        

        .btn-reset {
        
            color: white;
        }

        
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">EduPortal</div>
        <ul class="nav-links">
            <li><a href="#" class="active">Register</a></li>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Directory</a></li>
            <li><a href="#">Support</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="portal-card">
            <div class="header">
                <h1>Student Registration</h1>
                <p>Please fill in your details below</p>
            </div>

            <form class="form-grid">
                <div class="input-box">
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" placeholder="Enter first name" required>
                </div>

                <div class="input-box">
                    <label for="lname">Last Name</label>
                    <input type="text" id="lname" placeholder="Enter last name" required>
                </div>

                <div class="input-box">
                    <label for="fathername">Father's Name</label>
                    <input type="text" id="fathername" placeholder="Enter father's name" required>
                </div>

                <div class="input-box">
                    <label for="dob">Date of Birth (DOB)</label>
                    <input type="text" id="dob" placeholder="DD-MM-YYYY">
                </div>

                <div class="input-box">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="Enter mobile number">
                </div>

                <div class="input-box">
                    <label for="email">Email-Id</label>
                    <input type="email" id="email" placeholder="Enter email address">
                </div>

                <div class="action-buttons">
                    <button type="submit" class="btn-submit" style="background-color: green;">Submit Records</button>
                    <button type="reset" class="btn-reset" style="background-color: red;">Reset</button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
